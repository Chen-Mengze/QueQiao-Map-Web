buildscript {
    repositories {
        // FG 6.0.+ 与 forge userdev 制品都在 forge 官方 maven（国内可直连；neoforged maven 被 DNS 污染不用）
        maven { url = 'https://maven.aliyun.com/repository/public' }
        maven { url = 'https://maven.minecraftforge.net/' }
        gradlePluginPortal()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:6.0.+'
    }
}

apply plugin: 'net.minecraftforge.gradle'

// 源码 UTF-8（中文注释），不跟随系统 GBK 默认编码
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// ---- 版本覆盖层：forge-<ver>/ 里只有 gradle.properties（MC 版本 / 映射 / Java 版本）----
def mcTarget = (findProperty('mcTarget') ?: '1.20.1').toString()
def overlayFile = new File(rootDir, "forge/versions/${mcTarget}/gradle.properties")
def overlay = new Properties()
overlayFile.withInputStream { overlay.load(it) }
def P = { String k -> overlay.getProperty(k) }

group = mod_group_id
version = "${mod_version}+mc${P('minecraft_version')}"
archivesBaseName = mod_id

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(P('java_version') as int)
    }
}

minecraft {
    mappings channel: P('mapping_channel'), version: P('mapping_version')
    copyIdeResources = true
    // dev 运行任务（runServer 等）按里程碑需要时再开：
    // runs { server { workingDirectory project.file('run'); server = true } }
}

dependencies {
    minecraft "net.minecraftforge:forge:${P('minecraft_version')}-${P('forge_version')}"
    implementation project(':common')
    // 与 common/build.gradle 同款防御：不依赖「forge 侧签名暂不暴露鹊桥类型」的巧合，
    // compileOnly 显式声明编译期接口（运行期由鹊桥本体提供，绝不进 jar）
    compileOnly files("${rootDir}/libs/queqiao-tool-0.6.8.jar")
}

// 主结构类直接并进 mod jar：:common 无任何 net.minecraft 引用，reobf 不会碰它，
// 不引 shadow（FG6 + shadow 的 reobf 组合维护成本高）。
evaluationDependsOn(':common')
jar {
    archiveFileName = "${mod_id}-${version}.jar"
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from project(':common').sourceSets.main.output
    manifest {
        attributes([
                'Minecraft-Mod'    : 'true',
                'Minecraft-Mod-ID' : mod_id,
                'Minecraft-Mod-Version': version
        ])
    }
}

// 元数据模板在 src/main/templates（不在 resources）：用 from-closure 级 ReplaceTokens 过滤。
// 【勿改回 filesMatching/expand/eachFile】那类 DSL 产生 MatchingCopyAction，IDEA 资源模型
// 解析不了 → 'Cannot resolve resource filtering of MatchingCopyAction' 告警。
// resources 目录里的文件全部原样复制（未来 assets/png 放那里，二进制安全）。
// 注意：M3 开 runServer 时若 FG run 看不到渲染后的模板，需让 runs 依赖 processResources。
processResources {
    var tokens = [
            'mod_id'                : mod_id,
            'mod_version'           : mod_version,
            'mod_name'              : mod_name,
            'mod_license'           : mod_license,
            'mod_authors'           : mod_authors,
            'mod_description'       : mod_description,
            'loader_version_range'  : P('forge_loader_version_range'),
            'forge_version_range'   : P('forge_version_range'),
            'minecraft_version_range': P('minecraft_version_range'),
            'pack_format_number'    : P('pack_format_number')
    ].collectEntries { k, v -> [(k): String.valueOf(v)] }
    inputs.properties tokens
    from(file('src/main/templates')) {
        filter org.apache.tools.ant.filters.ReplaceTokens, tokens: tokens
    }
}