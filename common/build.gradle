plugins {
    id 'java-library'
}

// 源码 UTF-8（中文注释），不跟随系统 GBK 默认编码
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

group = mod_group_id
version = mod_version

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // 编译期只要鹊桥接口；运行期鹊桥类由鹊桥本体 jar 提供 —— 绝不 shade 进来
    compileOnly files("${rootDir}/libs/queqiao-tool-0.6.8.jar")
}
